apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: delete-with-replica
spec:
  postgresVersion: ${KUTTL_PG_VERSION}
  patroni:
    switchover:
      enabled: true
    dynamicConfiguration:
      postgresql:
        parameters:
          encryption_key_command: 'echo 0aa19145816bd81a8371a725ef223900'
  instances:
    - name: instance1
      replicas: 2
      dataVolumeClaimSpec:
        accessModes:
        - "ReadWriteOnce"
        resources:
          requests:
            storage: 1Gi
  backups:
    pgbackrest:
      repos:
      - name: repo1
        volume:
          volumeClaimSpec:
            accessModes:
            - "ReadWriteOnce"
            resources:
              requests:
                storage: 1Gi
